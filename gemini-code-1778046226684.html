<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>品牌爭奪戰 - 多人優化版</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        * { touch-action: manipulation; -webkit-tap-highlight-color: transparent; }
        body { -webkit-user-select: none; user-select: none; background-color: #0f172a; }
        .grid-map { display: grid; grid-template-columns: repeat(5, 1fr); gap: 4px; }
        .card-slot { aspect-ratio: 2/3; border: 1.5px solid #cbd5e1; border-radius: 6px; display: flex; align-items: center; justify-content: center; background: #fff; font-size: 18px; position: relative; }
        .path-active { background: #dcfce7 !important; border-color: #22c55e !important; color: #16a34a; font-weight: bold; }
        .is-start { border: 3px solid #6366f1 !important; background: #f5f3ff !important; }
        .is-target { border: 2.5px dashed #94a3b8 !important; background: #f8fafc; color: #94a3b8; }
        .hand-card { transition: all 0.2s; cursor: pointer; border: 2px solid #e2e8f0; width: 85px; height: 115px; flex-shrink: 0; background: white; border-radius: 10px; position: relative; }
        .hand-card.selected { transform: translateY(-10px); border-color: #6366f1; box-shadow: 0 5px 15px rgba(99,102,241,0.3); }
        #overlay, #target-modal, #player-count-view { z-index: 150; background: #0f172a; color: white; position: fixed; inset: 0; }
        .role-badge { font-size: 9px; padding: 1px 6px; border-radius: 99px; margin-left: 4px; font-weight: bold; }
        .badge-good { background: #dcfce7; color: #166534; }
        .badge-bad { background: #fee2e2; color: #991b1b; }
        .scrollbar-hide::-webkit-scrollbar { display: none; }
    </style>
</head>
<body class="font-sans text-slate-800">

    <div id="game-app" class="max-w-md mx-auto h-screen flex flex-col bg-slate-50 relative">
        
        <!-- 步驟 0：人數選擇 -->
        <div id="player-count-view" class="flex flex-col items-center justify-center p-8 text-center">
            <h2 class="text-2xl font-black mb-2 text-indigo-400 italic">BRAND SABOTEUR</h2>
            <p class="text-slate-400 mb-8 text-xs tracking-widest uppercase">Select Player Count</p>
            <div class="w-full space-y-4">
                <button onclick="selectCount(4)" class="w-full bg-white text-slate-900 py-4 rounded-2xl font-black shadow-lg">4 人遊戲 (3好1壞)</button>
                <button onclick="selectCount(5)" class="w-full bg-white text-slate-900 py-4 rounded-2xl font-black shadow-lg">5 人遊戲 (3好2壞)</button>
                <button onclick="selectCount(6)" class="w-full bg-white text-slate-900 py-4 rounded-2xl font-black shadow-lg">6 人遊戲 (4好2壞)</button>
            </div>
        </div>

        <!-- 目標選擇視窗 -->
        <div id="target-modal" class="hidden flex flex-col items-center justify-center p-8 text-center">
            <h2 id="modal-title" class="text-xl font-black mb-6 text-indigo-400">選擇對象</h2>
            <div id="player-list" class="w-full space-y-4 mb-8 text-slate-900"></div>
            <button onclick="closeModal()" class="text-slate-400 text-sm underline">取消行動</button>
        </div>

        <!-- 身分查看與轉場 -->
        <div id="overlay" class="hidden flex flex-col items-center justify-center p-6 text-center">
            <div id="setup-view" class="w-full">
                <h2 class="text-xl font-black mb-4 text-indigo-400 italic">BRAND SABOTEUR</h2>
                <p id="setup-msg" class="mb-6 text-slate-400 text-[10px] font-bold tracking-widest">請第 1 位玩家查看身分</p>
                <div id="id-card" onclick="revealID()" class="w-40 h-56 bg-indigo-600 rounded-2xl flex items-center justify-center cursor-pointer border-4 border-indigo-400 shadow-2xl mb-8 mx-auto">
                    <span id="id-text" class="font-bold text-lg text-white">點擊翻開</span>
                </div>
                <button id="setup-btn" onclick="nextID()" class="hidden w-full bg-white text-slate-900 py-4 rounded-xl font-bold text-sm">我記住了</button>
                <button id="start-game-final" onclick="startGameNow()" class="hidden w-full bg-green-500 text-white py-4 rounded-xl font-black text-sm tracking-widest">開始遊戲</button>
            </div>
            
            <div id="turn-view" class="hidden w-full">
                <p class="text-slate-400 mb-2 italic text-xs">移交手機給：</p>
                <h2 id="next-p-name" class="text-2xl font-black mb-8 text-white">玩家名稱</h2>
                <button onclick="unlockView()" class="w-full bg-indigo-500 py-4 rounded-2xl font-black text-lg">解鎖手牌</button>
            </div>
        </div>

        <header class="bg-white border-b px-4 py-2 flex justify-between items-center shadow-sm">
            <h1 class="font-black text-indigo-600 italic text-sm">BRAND SABOTEUR</h1>
            <div class="text-[9px] font-bold text-slate-400 italic">R: <span id="round-num">1</span>/3</div>
        </header>

        <main class="flex-1 p-3 overflow-y-auto bg-slate-200">
            <div id="map" class="grid-map w-full"></div>
        </main>

        <footer class="bg-white border-t p-3 pb-8">
            <div class="flex justify-between items-center mb-3">
                <div class="flex items-center">
                    <span id="curr-p-display" class="font-black text-slate-800 text-sm italic">玩家</span>
                    <span id="curr-p-role-badge" class="role-badge">---</span>
                    <span id="block-status" class="hidden ml-2 text-[8px] bg-red-500 text-white px-2 py-0.5 rounded-full animate-pulse">營運暫停</span>
                </div>
                <div class="flex items-center gap-2">
                    <span class="text-[10px] font-bold text-amber-600">💰<span id="curr-p-gold">0</span></span>
                    <button id="discard-btn" onclick="handleDiscard()" class="text-[9px] bg-slate-100 text-slate-500 px-2 py-1 rounded font-bold border">棄牌</button>
                </div>
            </div>
            <div id="hand" class="flex gap-2 overflow-x-auto pb-3 scrollbar-hide"></div>
            <div id="action-panel" class="bg-indigo-50 p-3 rounded-xl border border-indigo-200 flex justify-between items-center gap-2">
                <div class="flex-1">
                    <p id="info-title" class="font-bold text-indigo-900 text-[11px] mb-0.5">請選取一張卡牌</p>
                    <p id="info-desc" class="text-[9px] text-slate-600 leading-tight">確認接口正確後點擊地圖位置。</p>
                </div>
                <button id="act-btn" class="bg-slate-300 text-white px-5 py-2.5 rounded-lg font-black text-[10px] pointer-events-none">執行行動</button>
                <button id="pass-btn" onclick="goToNextPlayer()" class="hidden bg-indigo-600 text-white px-5 py-2.5 rounded-lg font-black text-[10px] shadow-lg">確認換人</button>
            </div>
        </footer>
    </div>

    <script>
        const CARDS_DB = {
            'road_cross': { name: '十字通路', icon: '╋', type: 'road', ports: [1, 1, 1, 1], desc: '四面通達，最有效的擴張卡。' },
            'road_t': { name: 'T字通路', icon: '┳', type: 'road', ports: [0, 1, 1, 1], desc: '三向分支通路。' },
            'road_corner_rb': { name: '右下通路', icon: '┏', type: 'road', ports: [0, 1, 1, 0], desc: '連接右與下。' },
            'road_corner_lt': { name: '左上通路', icon: '┛', type: 'road', ports: [1, 0, 0, 1], desc: '連接左與上。' },
            'road_corner_lb': { name: '左下通路', icon: '┓', type: 'road', ports: [0, 0, 1, 1], desc: '連接左與下。' },
            'road_corner_rt': { name: '右上通路', icon: '┗', type: 'road', ports: [1, 1, 0, 0], desc: '連接右與上。' },
            'break': { name: '惡意阻撓', icon: '🛑', type: 'break', desc: '使選定玩家暫停建設。' },
            'fix': { name: '危機公關', icon: '🛠️', type: 'fix', desc: '解除玩家暫停狀態。' },
            'rock': { name: '市場崩盤', icon: '⚒️', type: 'rock', desc: '移除場上一張通路卡。' },
            'map': { name: '數據市調', icon: '🗺️', type: 'map', desc: '探查目標市場真相。' }
        };

        let players = [], deck = [], turn = 0, setupIdx = 0, selectedIdx = null, map = Array(40).fill(null);
        let actionDone = false, currentRound = 1, goldPos = 0, totalPlayers = 4;

        // --- 核心修改：選擇人數 ---
        function selectCount(num) {
            totalPlayers = num;
            document.getElementById('player-count-view').classList.add('hidden');
            document.getElementById('overlay').classList.remove('hidden');
            initPlayers();
            startNewRound();
        }

        function initPlayers() {
            players = [];
            for(let i=0; i<totalPlayers; i++) {
                players.push({ id: i, name: `玩家 ${i+1}`, role: "", hand: [], blocked: false, gold: 0 });
            }
        }

        function startNewRound() {
            // 角色分配邏輯
            let roles = [];
            if(totalPlayers === 4) roles = ["壞對手", "好品牌", "好品牌", "好品牌"];
            else if(totalPlayers === 5) roles = ["壞對手", "壞對手", "好品牌", "好品牌", "好品牌"];
            else if(totalPlayers === 6) roles = ["壞對手", "壞對手", "好品牌", "好品牌", "好品牌", "好品牌"];
            
            roles = roles.sort(() => Math.random() - 0.5);
            players.forEach((p, i) => { p.role = roles[i]; p.hand = []; p.blocked = false; });
            
            // 建立卡池（增加十字路口權重）
            deck = [];
            const normalKeys = Object.keys(CARDS_DB);
            for(let i=0; i<100; i++) {
                // 提高十字路口機率 (約 30% 機率抽到)
                if(Math.random() < 0.3) deck.push('road_cross');
                else deck.push(normalKeys[Math.floor(Math.random()*normalKeys.length)]);
            }
            
            players.forEach(p => { for(let j=0; j<6; j++) p.hand.push(deck.pop()); });
            map = Array(40).fill(null);
            map[2] = { key: 'road_cross', active: true, start: true, ports: [1,1,1,1] };
            const tgts = [30, 32, 34]; goldPos = tgts[Math.floor(Math.random()*3)];
            tgts.forEach(t => map[t] = { target: true, isGold: t === goldPos, ports: [1,1,1,1] });
            setupIdx = 0; turn = 0; document.getElementById('round-num').innerText = currentRound;
            updateSetupUI();
        }

        function handleMapClick(i) {
            if (selectedIdx === null || actionDone) return;
            const p = players[turn % totalPlayers], k = p.hand[selectedIdx], c = CARDS_DB[k];
            if (c.type === 'road') {
                if (p.blocked) { alert("⚠️ 營運暫停中！需先執行危機公關。"); return; }
                if (map[i] && !map[i].target) return;
                if (!checkConnection(i, c.ports)) { alert("❌ 接口不吻合或未連接主通路！"); return; }
                if (map[i]?.target) {
                    if (i === goldPos) winRound("good", turn % totalPlayers);
                    else winRound("bad");
                    return; 
                } else { map[i] = { key: k, active: true, ports: c.ports }; }
            } else if (c.type === 'rock') {
                if (!map[i] || map[i].start || map[i].target) return;
                map[i] = null;
            } else if (c.type === 'map') {
                if (!map[i]?.target) return;
                alert(map[i].isGold ? "💎 這裡是真金市場！" : "🪨 這裡是石頭市場。");
            }
            completeAction();
        }

        function checkConnection(idx, newPorts) {
            let connectedToActive = false;
            const neighbors = [{ offset: -5, portIdx: 0, oppIdx: 2 }, { offset: 1, portIdx: 1, oppIdx: 3 }, { offset: 5, portIdx: 2, oppIdx: 0 }, { offset: -1, portIdx: 3, oppIdx: 1 }];
            for (const n of neighbors) {
                const ni = idx + n.offset;
                if (n.offset === 1 && idx % 5 === 4) continue;
                if (n.offset === -1 && idx % 5 === 0) continue;
                if (ni >= 0 && ni < 40) {
                    const neighbor = map[ni];
                    if (neighbor && (neighbor.active || neighbor.start || neighbor.target)) {
                        if (newPorts[n.portIdx] === 1 && neighbor.ports[n.oppIdx] === 1) connectedToActive = true;
                        else if (newPorts[n.portIdx] !== neighbor.ports[n.oppIdx]) return false;
                    }
                }
            }
            return connectedToActive;
        }

        function openTargetModal(type) {
            const modal = document.getElementById('target-modal'), list = document.getElementById('player-list');
            list.innerHTML = ''; modal.classList.remove('hidden');
            document.getElementById('modal-title').innerText = type === 'break' ? "選擇阻撓對象" : "選擇危機公關對象";
            players.forEach(p => {
                if ((type === 'break' && !p.blocked) || (type === 'fix' && p.blocked)) {
                    const btn = document.createElement('button');
                    btn.className = "w-full bg-white text-slate-900 py-3 rounded-xl font-bold shadow-md active:scale-95 transition-transform";
                    btn.innerText = p.name;
                    btn.onclick = () => { if(type==='break') p.blocked=true; else p.blocked=false; closeModal(); completeAction(); };
                    list.appendChild(btn);
                }
            });
            if (list.innerHTML === '') list.innerHTML = '<p class="text-slate-400">目前沒有符合條件的對象</p>';
        }

        function closeModal() { document.getElementById('target-modal').classList.add('hidden'); }

        function winRound(type, winnerIdx) {
            if (type === "good") { alert("🎉 好品牌方成功連通市場！恭喜獲勝！"); players[winnerIdx].gold += 1; }
            else { alert("😈 撞到石頭市場！品牌方擴張失敗，壞對手獲勝。"); players.filter(p => p.role === "壞對手").forEach(p => p.gold += 1); }
            if (currentRound < 3) { currentRound++; startNewRound(); }
            else { alert("🏆 遊戲結束！恭喜最終獲勝者。"); location.reload(); }
        }

        function completeAction() {
            const p = players[turn % totalPlayers];
            p.hand.splice(selectedIdx, 1);
            if (deck.length > 0) p.hand.push(deck.pop());
            actionDone = true; selectedIdx = null;
            renderMap(); renderHand(); updateUI();
        }

        function revealID() {
            document.getElementById('id-text').innerText = players[setupIdx].role;
            if (setupIdx < totalPlayers - 1) document.getElementById('setup-btn').classList.remove('hidden');
            else document.getElementById('start-game-final').classList.remove('hidden');
        }
        function nextID() { setupIdx++; updateSetupUI(); }
        function updateSetupUI() {
            document.getElementById('id-text').innerText = "點擊翻開";
            document.getElementById('setup-msg').innerText = `請第 ${setupIdx+1} 位玩家查看身分`;
            document.getElementById('setup-btn').classList.add('hidden');
            document.getElementById('start-game-final').classList.add('hidden');
        }
        function startGameNow() {
            document.getElementById('setup-view').classList.add('hidden');
            document.getElementById('turn-view').classList.remove('hidden');
            document.getElementById('next-p-name').innerText = players[0].name;
        }
        function unlockView() {
            document.getElementById('overlay').classList.add('hidden');
            actionDone = false; selectedIdx = null;
            document.getElementById('info-title').innerText = "請選取一張卡牌";
            document.getElementById('info-desc').innerText = "確認接口正確後點擊地圖位置。";
            renderMap(); renderHand(); updateUI();
        }
        function renderMap() {
            const el = document.getElementById('map'); el.innerHTML = '';
            map.forEach((d, i) => {
                const s = document.createElement('div');
                s.className = `card-slot ${d?.active ? 'path-active' : ''} ${d?.start ? 'is-start' : ''} ${d?.target ? 'is-target' : ''}`;
                s.onclick = () => handleMapClick(i);
                if(d) s.innerHTML = d.start ? '🏁' : (d.target ? '?' : CARDS_DB[d.key].icon);
                el.appendChild(s);
            });
        }
        function goToNextPlayer() {
            turn++;
            document.getElementById('overlay').classList.remove('hidden');
            document.getElementById('next-p-name').innerText = players[turn % totalPlayers].name;
        }
        function renderHand() {
            const el = document.getElementById('hand'), p = players[turn % totalPlayers]; el.innerHTML = '';
            p.hand.forEach((k, i) => {
                const card = CARDS_DB[k], d = document.createElement('div');
                d.className = `hand-card flex flex-col items-center justify-center p-2 text-center ${selectedIdx === i ? 'selected' : ''}`;
                d.onclick = () => { if(!actionDone) { selectedIdx = i; document.getElementById('info-title').innerText = card.name; document.getElementById('info-desc').innerText = card.desc; renderHand(); updateUI(); } };
                d.innerHTML = `<div class="text-2xl mb-1">${card.icon}</div><div class="text-[9px] font-black">${card.name}</div>`;
                el.appendChild(d);
            });
        }
        function updateUI() {
            const p = players[turn % totalPlayers];
            document.getElementById('curr-p-display').innerText = p.name;
            document.getElementById('curr-p-gold').innerText = p.gold;
            const badge = document.getElementById('curr-p-role-badge');
            badge.innerText = p.role;
            badge.className = `role-badge ${p.role === '壞對手' ? 'badge-bad' : 'badge-good'}`;
            const bStatus = document.getElementById('block-status');
            if (p.blocked) bStatus.classList.remove('hidden'); else bStatus.classList.add('hidden');
            const actBtn = document.getElementById('act-btn'), passBtn = document.getElementById('pass-btn'), discardBtn = document.getElementById('discard-btn');
            if (actionDone) {
                actBtn.classList.add('hidden'); discardBtn.classList.add('hidden'); passBtn.classList.remove('hidden');
            } else {
                actBtn.classList.remove('hidden'); discardBtn.classList.remove('hidden'); passBtn.classList.add('hidden');
                if (selectedIdx !== null) {
                    const c = CARDS_DB[p.hand[selectedIdx]];
                    actBtn.className = "bg-indigo-600 text-white px-5 py-2.5 rounded-lg font-black text-[10px]";
                    actBtn.onclick = () => { if(c.type==='break') openTargetModal('break'); else if(c.type==='fix') openTargetModal('fix'); };
                } else { actBtn.className = "bg-slate-300 text-white px-5 py-2.5 rounded-lg font-black text-[10px] pointer-events-none"; }
            }
        }
        function handleDiscard() { if (selectedIdx !== null && !actionDone) completeAction(); }
    </script>
</body>
</html>
